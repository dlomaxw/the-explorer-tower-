  <script>
    (function () {
      var FID = "01-curve";
      var $ = function (id) { return document.getElementById(id); };
      var NS = "http://www.w3.org/2000/svg";
      var tl = gsap.timeline({ paused: true });
      var IW = 1834, IH = 1024, K0 = 1.4136;

      function fT(el, from, to, t) {
        to.immediateRender = false;
        return tl.fromTo(el, from, to, t);
      }

      /* ---------- the line: hugs the curved balcony rings (image coordinates) ---------- */
      var RY = [830, 768, 706, 644, 582, 520, 458, 396, 334];
      var d = "M 900 835 C 960 838, 1010 836, 1033 830";
      for (var i = 0; i < RY.length - 1; i++) {
        d += " C 1018 " + (RY[i] - 18) + ", 1018 " + (RY[i] - 44) + ", 1033 " + RY[i + 1];
      }
      d += " C 1040 310, 1048 290, 1050 272 L 900 45 C 896 -40, 896 -140, 900 -260";
      var line = $("c01-line");
      line.setAttribute("d", d);
      var L = line.getTotalLength();
      line.style.strokeDasharray = L + " " + L;
      line.style.strokeDashoffset = L;
      function lenAtY(y) {
        for (var s = 0; s <= L; s += 2) { if (line.getPointAtLength(s).y <= y) return s; }
        return L;
      }
      function offAt(y) { return L - lenAtY(y); }

      /* ring glows */
      var ringsG = $("c01-rings"), ringEls = [];
      RY.forEach(function (y, k) {
        var p = document.createElementNS(NS, "path");
        p.setAttribute("id", "c01-ring" + k);
        p.setAttribute("class", "c01-ring");
        p.setAttribute("d", "M 985 " + (y - 34) + " C 1015 " + (y - 32) + ", 1034 " + (y - 22) + ", 1034 " + y);
        ringsG.appendChild(p);
        ringEls.push(p);
      });

      /* ---------- camera on the facade (single writer) ---------- */
      var world = $("c01-world"), dot = $("c01-dot"), cliprect = $("c01-cliprect");
      var cam = { u: 0.55, v: 0.625, z: 1.0 };
      function applyCam() {
        var k = K0 * cam.z;
        world.style.transform = "translate(" + (960 - cam.u * IW * k).toFixed(2) + "px," + (540 - cam.v * IH * k).toFixed(2) + "px) scale(" + k.toFixed(4) + ")";
        line.setAttribute("stroke-width", (14 / k).toFixed(2));
        dot.setAttribute("r", (7 / k).toFixed(2));
        cliprect.setAttribute("height", (cam.v * IH + 310 / k + 2000).toFixed(1));
      }
      function camT(props, dur, ease, t) {
        var o = { duration: dur, ease: ease, onUpdate: applyCam };
        for (var key in props) o[key] = props[key];
        tl.to(cam, o, t);
      }
      camT({ v: 0.585, u: 0.55 }, 0.9, "none", 0);
      camT({ u: 0.50, v: 0.547, z: 1.5 }, 0.6, "expo.inOut", 0.9);
      camT({ v: 0.35, u: 0.50 }, 0.6, "none", 1.5);
      camT({ u: 0.50, v: 0.22, z: 1.62 }, 0.5, "power2.out", 2.1);
      camT({ v: 0.12, z: 1.8 }, 0.5, "power3.in", 2.6);
      camT({ v: -0.40, z: 1.8 }, 0.9, "power2.out", 3.1);

      /* camera blur on the facade stage */
      var stage = $("c01-stage");
      function blurT(px0, px1, dur, ease, t) {
        fT(stage, { filter: "blur(" + px0 + "px)" }, { filter: "blur(" + px1 + "px)", duration: dur, ease: ease }, t);
      }
      blurT(0, 8, 0.3, "power2.in", 0.9);
      blurT(8, 0, 0.3, "power2.out", 1.2);
      blurT(0, 10, 0.6, "power2.in", 2.2);
      blurT(10, 4, 0.6, "power2.out", 2.8);

      /* motion-blur ghost of the facade, 40 px up */
      fT($("c01-ghost"), { opacity: 0, y: 0 }, { opacity: 0.45, y: -20, duration: 0.15, ease: "power2.out" }, 1.2);
      fT($("c01-ghost"), { opacity: 0.45, y: -20 }, { opacity: 0, y: -40, duration: 0.15, ease: "power2.in" }, 1.35);

      /* ---------- line draw: Scene 1 and 2 ---------- */
      tl.to(line, { strokeDashoffset: offAt(830), duration: 0.3, ease: "power2.out" }, 0.30);
      tl.to(line, { strokeDashoffset: offAt(768), duration: 0.3, ease: "power1.out" }, 0.60);
      tl.to(line, { strokeDashoffset: offAt(582), duration: 0.8, ease: "none" }, 0.90);
      tl.to(line, { strokeDashoffset: offAt(458), duration: 0.25, ease: "none" }, 1.70);
      tl.to(line, { strokeDashoffset: offAt(334), duration: 0.25, ease: "none" }, 1.95);
      tl.to(line, { strokeDashoffset: offAt(274), duration: 0.15, ease: "none" }, 2.20);
      tl.to(line, { strokeDashoffset: offAt(48), duration: 0.22, ease: "power2.out" }, 2.35);
      tl.to(line, { strokeDashoffset: 0, duration: 0.23, ease: "power2.in" }, 2.57);
      tl.to(line, { strokeDashoffset: -L, duration: 0.30, ease: "power3.in" }, 2.80);
      fT(dot, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.in" }, 2.80);

      /* rings: light up from the bottom every 0.15 s, glow when the line passes */
      ringEls.forEach(function (p, k) {
        fT(p, { opacity: 0 }, { opacity: 0.55, duration: 0.2, ease: "power2.out" }, 0.60 + k * 0.15);
      });
      [[4, 1.70], [6, 1.95], [8, 2.20]].forEach(function (pr) {
        var p = ringEls[pr[0]], t = pr[1];
        tl.to(p, { opacity: 1, duration: 0.08, ease: "power2.out" }, t);
        tl.to(p, { opacity: 0.55, duration: 0.12, ease: "power2.in" }, t + 0.08);
      });
      fT($("c01-roofedge"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 2.35);
      fT($("c01-roofedge"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 2.85);

      /* ---------- titles ---------- */
      var one = $("c01-one"), curve = $("c01-curve"), trait = $("c01-trait");
      fT(one, { opacity: 0, scale: 1.6, filter: "blur(24px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out" }, 0.05);
      fT(curve, { opacity: 0, scale: 1.5, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, 0.40);
      fT(trait, { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.40);
      [one, curve, trait].forEach(function (el) {
        fT(el, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(12px)", duration: 0.15, ease: "power2.in" }, 1.40);
      });

      /* ---------- subtitles ---------- */
      function word(id, cue) {
        var el = $(id);
        fT(el, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
        fT(el, { color: "rgba(255,255,255,.55)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.14);
      }
      function keybox(wid, boxId, txtId, cue) {
        var tx = $(txtId);
        fT($(boxId), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, cue - 0.07);
        fT(tx, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
        fT(tx, { color: "rgba(255,255,255,.55)" }, { color: "#111111", duration: 0.12, ease: "power1.out" }, cue + 0.04);

      word("c01-s1w0", 0.03);
      keybox("c01-s1w1", "c01-s1box", "c01-s1bt", 0.38);
      fT($("c01-sub1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.36);

      word("c01-s2w0", 1.48);
      word("c01-s2w1", 1.65);
      word("c01-s2w2", 1.72);
      word("c01-s2w3", 2.36);
      word("c01-s2w4", 2.47);
      keybox("c01-s2w5", "c01-s2box", "c01-s2bt", 2.55);
      fT($("c01-sub2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.80);

      fT($("c01-rail"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.10);

      /* ---------- Scene 3: day turns to night, aerial of Kololo ---------- */
      fT($("c01-grade"), { opacity: 0 }, { opacity: 0.8, duration: 0.8, ease: "power2.inOut" }, 3.10);

      var aer = $("c01-aer"), aw = $("c01-aw");
      var A = { off: 1080, drift: 0 };
      function applyAer() {
        aw.style.transform = "translate(-63.3px," + (-55 + A.drift + A.off).toFixed(2) + "px) scale(1.056)";
      }
      applyAer();
      tl.set(aer, { opacity: 1 }, 3.60);
      tl.to(A, { off: 0, duration: 0.9, ease: "expo.out", onUpdate: applyAer }, 3.60);

      fT($("c01-dim"), { opacity: 0.6 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, 3.90);
      for (var r = 0; r < 4; r++) {
        var rg = $("c01-d" + r);
