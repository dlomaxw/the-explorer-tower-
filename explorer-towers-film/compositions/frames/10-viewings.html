      var FID = "10-viewings";
      var $ = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });

      function fT(el, from, to, t) {
        to.immediateRender = false;
        return tl.fromTo(el, from, to, t);

      var cam = $("c10-cam"), card = $("c10-card");

      /* ---------- handoff_in: cam 1.12, blur 8 on the card; settle 0 to 0.3 ---------- */

      gsap.set(card, { filter: "blur(8px)" });
      tl.to(cam, { scale: 1.06, duration: 0.3, ease: "expo.out" }, 0);
      tl.to(card, { filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0);
      /* drift, then pull-out to cam 1.0 (monotonic zoom-out) */
      tl.to(cam, { scale: 1.02, duration: 1.4, ease: "none" }, 0.3);
      tl.to(cam, { scale: 1.0, duration: 0.74, ease: "expo.in" }, 1.7);
      /* camera blur on the card during the pull-out */
      fT(card, { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.38, ease: "power2.in" }, 1.7);

      /* ---------- Scene 1: the Viewings row ---------- */
      fT($("c10-track"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 0.5);
      fT($("c10-tick1"), { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power3.out" }, 0.8);
      fT($("c10-t1"), { opacity: 0, y: 24, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0.98);

      fT($("c10-vvisit"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.28);

      /* ---------- Scene 2: the bar fills from 9:30 to 7:00 ---------- */
      tl.to($("c10-fill"), { scaleX: 1, duration: 0.8, ease: "power3.out" }, 1.4);
      fT($("c10-glow"), { opacity: 0 }, { opacity: 0.7, duration: 0.8, ease: "power3.out" }, 1.4);
      fT($("c10-tick2"), { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power3.out" }, 1.6);
      fT($("c10-t2"), { opacity: 0, y: 24, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 1.58);

      /* ---------- the card collapses toward the center, becomes the line ---------- */
      fT($("c10-cc"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 1.8);
      tl.to(card, { scaleY: 5 / 600, scaleX: 1.14, duration: 0.4, ease: "expo.in" }, 1.7);
      fT(card, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none" }, 2.08);
      fT($("c10-line"), { opacity: 0, scaleX: 1.14 }, { opacity: 1, duration: 0.08, ease: "none" }, 2.04);
      tl.to($("c10-line"), { scaleX: 1, duration: 0.4, ease: "power1.in" }, 2.04);

      /* ---------- backgrounds: dusk tower, then night aerial ---------- */
      fT($("c10-bg1"), { filter: "brightness(.45) blur(3px)" }, { filter: "brightness(.4) blur(5px)", duration: 0.6, ease: "power2.out" }, 1.7);
      fT($("c10-bg2"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 1.7);

      /* ---------- subtitles ---------- */
      function word(id, cue) {
        var el = $(id);
        fT(el, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
        fT(el, { color: "rgba(255,255,255,.55)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.14);
      }
      function keybox(wid, boxId, txtId, cue) {
        word(wid, cue);
        fT($(boxId), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, cue - 0.05);
        fT($(txtId), { color: "#ffffff" }, { color: "#111111", duration: 0.12, ease: "power1.out" }, cue + 0.02);
      }
      tl.set($("c10-sub1"), { opacity: 1 }, 0.18);
      keybox("c10-s1w0", "c10-s1box", "c10-s1bt", 0.2);
      fT($("c10-sub1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 0.76);

      tl.set($("c10-sub2"), { opacity: 1 }, 0.88);
