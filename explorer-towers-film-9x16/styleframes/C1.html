<!doctype html><html><head><meta charset="utf-8"><title>C1 aerial</title><style>

@font-face{font-family:M;font-weight:600;src:url(../assets/fonts/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(../assets/fonts/montserrat-latin-800-normal.woff2)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0c0c0e;font-family:M,sans-serif}
.abs{position:absolute}
.img{position:absolute;background-size:cover;background-position:center}
.sub{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:44px;font-weight:600;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.55);letter-spacing:.2px}
.sub.dk{color:#111;text-shadow:none}
.sub b{background:#FFD60A;color:#111;padding:2px 16px;border-radius:6px;font-weight:800;text-shadow:none}
.disc{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:15px;color:rgba(255,255,255,.55)}

.bg{inset:-80px;background-image:url(../assets/img/aerial-dusk.webp);transform:scale(1.5) translate(4%,-2%);transform-origin:60% 50%}
.mb{inset:-80px;background-image:url(../assets/img/aerial-dusk.webp);transform:scale(1.6) translate(4%,-2%);transform-origin:60% 50%;filter:blur(26px);opacity:.6;-webkit-mask-image:radial-gradient(ellipse at 55% 50%,transparent 35%,#000 80%)}
