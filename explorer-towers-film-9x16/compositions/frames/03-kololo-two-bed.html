    (function () {
      var FID = "03-kololo-two-bed";

      var tl = gsap.timeline({ paused: true });

      function fT(el, from, to, t) {
        to.immediateRender = false;
        return tl.fromTo(el, from, to, t);
      }

      /* ---------- Scene 1: the pin is the iris ---------- */
      var fl = $("c03-floors");
      for (var f = 0; f < 10; f++) {

      tl.to($("c03-disc"), { scale: 24, duration: 0.32, ease: "expo.in" }, 0.03);
      tl.to($("c03-halo"), { opacity: 0, duration: 0.3, ease: "power2.in" }, 0);
      tl.set($("c03-pdisc"), { opacity: 1, scale: 0.5 }, 0.06);
      tl.to($("c03-pdisc"), { scale: 24, duration: 0.32, ease: "expo.in" }, 0.06);
      tl.set($("c03-aer"), { opacity: 0 }, 0.40);
      tl.set($("c03-halo"), { opacity: 0 }, 0.40);
      tl.set($("c03-pin"), { opacity: 0 }, 0.40);
      tl.set($("c03-disc"), { opacity: 0 }, 0.40);
      fT($("c03-warm"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.45);
      fT($("c03-grain"), { opacity: 0.04 }, { opacity: 0.03, duration: 5.28, ease: "none" }, 0);

      /* hairlines: map lines resolve into faint paper hairlines, then give way to the card edge */
      var hair = $("c03-hair");
      fT(hair, { opacity: 0, y: 0, filter: "blur(4px)" }, { opacity: 0.7, y: -12, filter: "blur(3px)", duration: 0.3, ease: "power2.out" }, 0.45);
      tl.to(hair, { y: -40, duration: 1.0, ease: "none" }, 0.75);
      tl.to(hair, { opacity: 0, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 1.40);

      /* display words */
      function display(el, cue) {
        fT(el, { opacity: 0, scale: 1.5, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, cue);
        fT(el, { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -24, filter: "blur(12px)", duration: 0.15, ease: "power2.in" }, 1.80);
      }
      display($("c03-dk"), 0.22);
      display($("c03-dm"), 1.02);

      /* ---------- camera on the card column (single writer), pans DOWN ---------- */
      var world = $("c03-world");
      var cam = { cx: 540, cy: 960, s: 0.9 };
      function applyCam() {
        world.style.transform = "translate(540px,960px) scale(" + cam.s.toFixed(4) + ") translate(" + (-cam.cx).toFixed(2) + "px," + (-cam.cy).toFixed(2) + "px)";
      }
      function camT(props, dur, ease, t) {
        var o = { duration: dur, ease: ease, onUpdate: applyCam };
        for (var k in props) o[k] = props[k];
        tl.to(cam, o, t);
      }
      camT({ s: 1.0 }, 4.2, "none", 0.4);
      camT({ cy: 1114 }, 0.25, "power3.inOut", 1.75);
      camT({ cy: 2120 }, 0.68, "power2.in", 4.60);
      fT($("c03-stage"), { filter: "blur(0px)" }, { filter: "blur(14px)", duration: 0.68, ease: "power2.in" }, 4.60);

      fT(c2, { opacity: 0, y: 1500 }, { opacity: 1, y: 1270, duration: 0.35, ease: "power3.out" }, 1.40);
      tl.to(c2, { y: 0, duration: 0.2, ease: "expo.out" }, 2.00);
      tl.set($("c03-img2"), { y: 80 }, 0);
      tl.to($("c03-img2"), { y: 0, duration: 0.3, ease: "expo.out" }, 2.00);

      /* neighbours: binary arrival (waterfall), blurred, from the bottom edge */
      var c3 = $("c03-c3"), c4 = $("c03-c4");
      tl.set(c3, { opacity: 1, y: 90 }, 2.60);

      tl.to(typ, { n: NAME.length, duration: 0.2, ease: "none", onUpdate: function () {
        name.textContent = NAME.slice(0, Math.round(typ.n));

      /* FROM label, then the price counter rolls */
      fT($("c03-from"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.14, ease: "power3.out" }, 3.50);
      fT($("c03-pw"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out" }, 3.51);

        price.textContent = "USD " + Math.round(pv.v).toLocaleString("en-US");

        fT(el, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
