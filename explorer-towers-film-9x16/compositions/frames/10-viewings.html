  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "10-viewings";
      var $ = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });

      function fT(el, from, to, t) {
        to.immediateRender = false;
        return tl.fromTo(el, from, to, t);
      }

      /* ---------- phone number, complete (same slots as frames 8/9) ---------- */
      var chars = [
        ["+", "c10-box", 58], ["2", "c10-box", 54], ["5", "c10-box", 54], ["6", "c10-box", 54],
        [" ", "c10-box", 29],
        ["7", "c10-box", 54], ["5", "c10-box", 54], ["0", "c10-box", 54],
        ["4", "c10-rest", 54], ["2", "c10-rest", 54], ["1", "c10-rest", 54],
        ["2", "c10-rest", 54], ["2", "c10-rest", 54], ["4", "c10-rest", 54]
      ];
      chars.forEach(function (c) {
        var slot = document.createElement("div");
        slot.className = "c10-slot";
        slot.style.width = c[2] + "px";
        if (c[0] !== " ") {
          var cell = document.createElement("div");
          cell.className = "c10-cell";
          cell.textContent = c[0];
          slot.appendChild(cell);
        }
        $(c[1]).appendChild(slot);
      });

      /* ---------- camera geometry ---------- */
      /* card sits at its FINAL place (top 560, 800 tall, center y 960); the camera wrapper moves it.
         map(p) = 960 + s * (p - 960) + y   (origin 540,960) */
      var H = 800;
      var hrow = $("c10-hrow"), cc = $("c10-cc");
      var rowNat = 560 + (cc.offsetTop || 64) + (hrow.offsetTop || 300) + 20;
      if (rowNat < 700 || rowNat > 1300) rowNat = 912;
      var cardcam = $("c10-cardcam"), bgcam = $("c10-bgcam"), stage = $("c10-stage"), card = $("c10-card");

      var S0 = 1.12, Y0 = 128;                 /* handoff_in: card top at 640, push 1.12 */
      var S1 = 1.06, Y1 = (900 - 960) - S1 * (rowNat - 960); /* Viewings row near y 900 */
      var Y2 = Y1 / 2;

      gsap.set(cardcam, { transformOrigin: "540px 960px", scale: S0, y: Y0 });
      gsap.set(bgcam, { transformOrigin: "540px 960px", scale: S0 });
      gsap.set(stage, { filter: "blur(8px)" });

      /* push toward the Viewings row, blur clears */
      tl.to(cardcam, { scale: S1, y: Y1, duration: 0.5, ease: "expo.out" }, 0);
      tl.to(bgcam, { scale: S1, duration: 0.5, ease: "expo.out" }, 0);
      tl.to(stage, { filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 0);
      fT($("c10-title"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, 0);

      /* drift, then pull-out to 1.0 with the card centered on y 960 */
      tl.to(cardcam, { scale: 1.02, y: Y2, duration: 1.2, ease: "none" }, 0.5);
      tl.to(bgcam, { scale: 1.02, duration: 1.2, ease: "none" }, 0.5);
      tl.to(cardcam, { scale: 1.0, y: 0, duration: 0.74, ease: "expo.in" }, 1.7);
      tl.to(bgcam, { scale: 1.0, duration: 0.74, ease: "expo.in" }, 1.7);
      fT(card, { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.38, ease: "power2.in" }, 1.7);

      /* ---------- Scene 1: the Viewings row ---------- */
      fT($("c10-track"), { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 0.5);
      fT($("c10-tick1"), { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power3.out" }, 0.8);
      fT($("c10-t1"), { opacity: 0, y: 24, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 0.98);
      fT($("c10-vmail"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.18);
      fT($("c10-vvisit"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.28);

      /* ---------- Scene 2: the bar fills from 9:30 to 7:00 ---------- */
      tl.to($("c10-fill"), { scaleX: 1, duration: 0.8, ease: "power3.out" }, 1.4);
      fT($("c10-glow"), { opacity: 0 }, { opacity: 0.7, duration: 0.8, ease: "power3.out" }, 1.4);
      fT($("c10-tick2"), { opacity: 1, scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power3.out" }, 1.6);
      fT($("c10-t2"), { opacity: 0, y: 24, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 1.58);

      /* ---------- the card collapses toward the center, becomes the line ---------- */
      fT($("c10-cc"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 1.8);
      tl.to(card, { scaleY: 5 / H, scaleX: 880 / 960, duration: 0.4, ease: "expo.in", transformOrigin: "50% 50%" }, 1.7);
      fT(card, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none" }, 2.08);
      fT($("c10-line"), { opacity: 0, scaleX: 880 / 700 }, { opacity: 1, duration: 0.08, ease: "none" }, 2.04);
      tl.to($("c10-line"), { scaleX: 1, duration: 0.4, ease: "none" }, 2.04);

      /* ---------- backgrounds: dusk tower drifting up, then night aerial ---------- */
      var bg1 = $("c10-bg1"), bg2 = $("c10-bg2");
      gsap.set(bg1, { scale: 1.15, y: -50, transformOrigin: "50% 50%" });
      gsap.set(bg2, { scale: 2100 / 1920, transformOrigin: "50% 46%" });
      tl.to(bg1, { y: -100, duration: 2.44, ease: "none" }, 0);
      fT(bg1, { filter: "brightness(.45) blur(3px)" }, { filter: "brightness(.4) blur(5px)", duration: 0.6, ease: "power2.out" }, 1.7);
      fT(bg2, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 1.7);

      /* ---------- subtitles ---------- */
      function word(id, cue) {
        var el = $(id);
        fT(el, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
        fT(el, { color: "rgba(255,255,255,.55)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.14);
      }
      function keybox(wid, boxId, txtId, cue) {
        word(wid, cue);
        fT($(boxId), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, cue - 0.05);
        fT($(txtId), { color: "#ffffff" }, { color: "#111111", duration: 0.12, ease: "power1.out" }, cue + 0.02);
      }
      tl.set($("c10-sub1"), { opacity: 1 }, 0.18);
      keybox("c10-s1w0", "c10-s1box", "c10-s1bt", 0.2);
      fT($("c10-sub1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 0.76);

      tl.set($("c10-sub2"), { opacity: 1 }, 0.88);
      word("c10-s2w0", 0.9);
      keybox("c10-s2w1", "c10-s2box", "c10-s2bt", 1.18);
      word("c10-s2w2", 1.52);
      word("c10-s2w3", 1.67);
      fT($("c10-sub2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.1);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
