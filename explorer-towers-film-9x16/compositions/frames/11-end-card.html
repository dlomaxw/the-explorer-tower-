  <script>
    (function () {
      var FID = "11-end-card";
      var $ = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      function fT(el, from, to, t) { to.immediateRender = false; return tl.fromTo(el, from, to, t); }

      /* ---- split wordmark into letters ---- */
      function split(host, text, prefix) {
        var out = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span");
          s.className = "c11-l"; s.id = prefix + i; s.textContent = text.charAt(i);
          host.appendChild(s); out.push(s);
        }
        return out;
      }
      var lA = split($("c11-w-a"), "Explorer", "c11-la");
      var lB = split($("c11-w-bt"), "Towers", "c11-lb");

      /* ---- windows (aerial space 2000x1125, compressed around the tower) ---- */
      var WP = [[1195,745],[935,700],[640,615],[1195,660],[940,630],[640,525],[1195,580],[935,545],[640,430],[1195,490],[935,455],[1195,400]];
      var winHost = $("c11-wins"), wins = [];
      WP.forEach(function (p, k) {
        var d = document.createElement("div");
        d.id = "c11-win" + k; d.className = "c11-win";
        d.style.left = (1000 + (p[0] - 1000) * 0.7).toFixed(1) + "px"; d.style.top = p[1] + "px";
        winHost.appendChild(d); wins.push(d);
      });

      /* ---- camera on the aerial (single writer); K fits 2000x1125 to height 2100 ---- */
      var K = 1.8667;
      var aw = $("c11-aw");
      var cam = { dx: 0, dy: 0, s: 1.0 };
      function applyCam() {
        var S = K * cam.s;
        aw.style.transform = "translate(" + (540 - 1000 * S + cam.dx).toFixed(2) + "px," + (960 - 562.5 * S + cam.dy).toFixed(2) + "px) scale(" + S.toFixed(4) + ")";
      }
      applyCam();
      tl.to(cam, { dx: 60, dy: -60, duration: 7.7, ease: "none", onUpdate: applyCam }, 0);
      tl.to(cam, { s: 1.12, duration: 6.2, ease: "none", onUpdate: applyCam }, 0);
      tl.fromTo(cam, { s: 1.12 }, { s: 1.19, duration: 1.5, ease: "none", immediateRender: false, onUpdate: applyCam }, 6.2);

      /* ---- Scene 1: the line opens into the aerial, wordmark ---- */
      var line = $("c11-line");
      tl.to(line, { scaleX: 0.743, duration: 0.4, ease: "none" }, 0);
      tl.to(line, { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 0.15);
      tl.to(aw, { filter: "blur(0px)", duration: 0.8, ease: "power2.out" }, 0);
      tl.to($("c11-dim"), { opacity: 0.45, duration: 0.6, ease: "power2.out" }, 0);
      tl.to($("c11-shade"), { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);

      lA.forEach(function (el, i) {
        fT(el, { opacity: 0, y: -70, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, 0.16 + i * 0.05);
      });
      lB.forEach(function (el, i) {
        fT(el, { opacity: 0, y: -70, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, 0.60 + i * 0.035);
      });
      tl.to($("c11-stroke"), { scaleX: 1, duration: 0.49, ease: "expo.out" }, 0.81);

      /* windows flicker on */
      wins.forEach(function (w, k) {
        var t = 0.35 + Math.floor(k / 2) * 0.15;
        fT(w, { opacity: 0 }, { opacity: 0.6, duration: 0.06, ease: "power2.out" }, t);
        tl.to(w, { opacity: 0.15, duration: 0.06, ease: "power2.in" }, t + 0.06);
        tl.to(w, { opacity: 0.75, duration: 0.08, ease: "power2.out" }, t + 0.14);
        tl.to(w, { opacity: 0.45, duration: 0.2, ease: "power2.out" }, t + 0.24);
      });

      /* extra twinkle passes, continuous life */
      [1.6, 2.9, 4.2].forEach(function (st) {
        wins.forEach(function (w, k) {
          var t = st + k * 0.1;
          tl.to(w, { opacity: 0.85, duration: 0.15, ease: "power2.out" }, t);
          tl.to(w, { opacity: 0.45, duration: 0.25, ease: "power2.in" }, t + 0.15);
        });
      });

      /* light sweep across the wordmark */
      fT($("c11-sweep"), { opacity: 0, x: -300 }, { opacity: 1, x: 1100, duration: 0.9, ease: "none" }, 0.9);
      tl.set($("c11-sweep"), { opacity: 0 }, 1.8);

      /* ---- Scene 2: tagline, phone, plates, disclaimer, url ---- */
      function tagWord(id, cue) {
        fT($(id), { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      }
      tagWord("c11-t0", 1.88);
      tagWord("c11-t1", 2.23);
      tagWord("c11-t2", 2.68);
      tagWord("c11-t3", 3.50);
      tagWord("c11-t4", 3.83);
      fT($("c11-box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 3.78);
      fT($("c11-kt"), { color: "#FFD60A" }, { color: "#111111", duration: 0.12, ease: "power1.out" }, 3.85);

      ["c11-p0", "c11-p1", "c11-p2"].forEach(function (id, i) {
        fT($(id), { opacity: 0, y: 46, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 3.20 + i * 0.08);
      });

      fT($("c11-lg1"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "expo.out" }, 3.50);
      fT($("c11-lg2"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: "expo.out" }, 3.60);
      fT($("c11-disc"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.90);
      fT($("c11-url"), { opacity: 0, y: 8, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.25, ease: "power3.out" }, 4.10);

      /* ---- Scene 3: button, cursor click, hold ---- */
      var btn = $("c11-btn");
      fT(btn, { opacity: 0, y: 36, scale: 1.1, filter: "blur(6px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 4.30);

      var TX = 540, TY = 974, MOVE = 4.45, CLICK = 4.92;
      var cur = $("c11-cur");
      gsap.set(cur, { x: 1010, y: 1240 });
      fT(cur, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, MOVE);
      tl.to(cur, { x: TX, duration: 0.45, ease: "expo.out" }, MOVE);
      tl.to(cur, { y: TY, duration: 0.45, ease: "power2.inOut" }, MOVE);
      tl.to(cur, { scale: 0.85, duration: 0.06, ease: "power2.in" }, CLICK);
      tl.to(cur, { scale: 1, duration: 0.06, ease: "power2.out" }, CLICK + 0.06);
      tl.to(btn, { scale: 0.95, duration: 0.06, ease: "power2.in" }, CLICK);
      tl.to(btn, { scale: 1, duration: 0.06, ease: "power2.out" }, CLICK + 0.06);

      var r1 = $("c11-rip1"), r2 = $("c11-rip2");
      r1.style.left = (TX - 50) + "px"; r1.style.top = (TY - 50) + "px";
      r2.style.left = (TX - 50) + "px"; r2.style.top = (TY - 50) + "px";
      fT(r1, { scale: 0, opacity: 0.9 }, { scale: 6, opacity: 0, duration: 0.8, ease: "power3.out" }, CLICK + 0.02);
      fT(r2, { scale: 0, opacity: 0.7 }, { scale: 6, opacity: 0, duration: 0.8, ease: "power3.out" }, CLICK + 0.10);

      fT($("c11-fill"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, CLICK + 0.04);
      fT($("c11-lab"), { color: "#ffffff" }, { color: "#111111", duration: 0.2, ease: "power2.out" }, CLICK + 0.04);

      /* windows twinkle in sequence */
      wins.forEach(function (w, k) {
        var t = 5.50 + k * 0.1;
        tl.to(w, { opacity: 0.95, duration: 0.15, ease: "power2.out" }, t);
        tl.to(w, { opacity: 0.45, duration: 0.25, ease: "power2.in" }, t + 0.15);
      });

      /* the line traces the tower's curve once more */
      var tr = $("c11-trace");
      var TLEN = tr.getTotalLength();
      tr.style.strokeDasharray = TLEN + " " + TLEN;
      tr.style.strokeDashoffset = TLEN;
      tl.set(tr, { opacity: 1 }, 6.2);
      tl.to(tr, { strokeDashoffset: 0, duration: 1.0, ease: "none" }, 6.2);

      /* final black */
      fT($("c11-black"), { opacity: 0 }, { opacity: 1, duration: 0.27, ease: "power2.in" }, 7.35);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
