<div id="root" data-composition-id="06-not-template" data-start="0" data-duration="4.82" data-width="1080" data-height="1920">
  <div id="f06-ground" class="clip" data-start="0" data-duration="4.82" data-track-index="0"></div>

    <div id="f06-board"></div>

  </div>
  <div id="f06-sub1" class="f06-s mk-root"></div>
  <div id="f06-sub2" class="f06-s mk-root"></div>
  <div id="f06-sub3" class="f06-s mk-root"></div>
</div>

<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/icons.js"></script>
<script src="assets/vendor/motion-kit.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var qs = MK.qs, qsa = MK.qsa;
  var D = 4.82;

  /* ---------- build the board ---------- */
  var cols = [
    { n: "New Leads", v: 24, cards: 4 },
    { n: "In Progress", v: 12, cards: 3 },
    { n: "Closed Won", v: 8, cards: 2 },
    { n: "Follow-ups", v: 6, cards: 2 }
  ];
  var inner = '<div id="f06-top"><img src="assets/img/mark.png" alt=""/><b>Bright CRM</b></div>';
  cols.forEach(function (c, i) {
    var h = '<div class="f06-col" id="f06-col' + i + '">' +
      '<div class="f06-hd"><i class="f06-bg" id="f06-hl' + i + '"></i><div class="f06-nm" id="f06-t' + i + '">' + c.n + '</div><div class="f06-num" id="f06-n' + i + '">0</div></div>';
    for (var k = 0; k < c.cards; k++) {
      h += '<div class="f06-card" style="top:' + (134 + k * 118) + 'px"><i class="a"></i><i class="b"></i><i class="c"></i></div>';
    }
    inner += h + '</div>';
  });
  inner += '<div id="f06-sweep"></div>';
  qs("#f06-board").innerHTML = MK.browser("f06-browser", "Bright CRM", inner);

  var SX = function (s) { return 31 + s * 228; };
  /* layouts: slot (x position) and dy of each column */
  var layouts = [
    { slot: [0, 1, 2, 3], dy: [0, 0, 0, 0], hi: 0 },
    { slot: [1, 0, 3, 2], dy: [34, 0, 34, 0], hi: 1 },
    { slot: [3, 1, 0, 2], dy: [0, 34, 0, 34], hi: 3 },
    { slot: [1, 2, 3, 0], dy: [0, 0, 0, 0], hi: 2 }
  ];
  cols.forEach(function (c, i) {
    gsap.set("#f06-col" + i, { x: SX(layouts[0].slot[i]), y: layouts[0].dy[i] });
  });
  var cs = getComputedStyle(document.documentElement);
  var C_SOFT = cs.getPropertyValue("--mk-ink-soft").trim(), C_INK = cs.getPropertyValue("--mk-ink").trim(), C_ON = cs.getPropertyValue("--mk-on-primary").trim();
  function hiOn(T, i, d) {
    tl.to("#f06-hl" + i, { opacity: 1, duration: d, ease: "none" }, T);
    tl.to("#f06-t" + i, { color: C_ON, duration: d, ease: "none" }, T);
    tl.to("#f06-n" + i, { color: C_ON, duration: d, ease: "none" }, T);
  }
  function hiOff(T, i, d) {
    tl.to("#f06-hl" + i, { opacity: 0, duration: d, ease: "none" }, T);
    tl.to("#f06-t" + i, { color: C_SOFT, duration: d, ease: "none" }, T);
    tl.to("#f06-n" + i, { color: C_INK, duration: d, ease: "none" }, T);
  }
  gsap.set("#f06-hl0", { opacity: 1 });
  gsap.set("#f06-t0", { color: C_ON });
  gsap.set("#f06-n0", { color: C_ON });
  MK.hide(".f06-card");

  /* team discs */
  var team = [["layers", "f06-av1"], ["cube", "f06-av2"], ["check", "f06-av3"]];
  team.forEach(function (t) {
    var d = document.createElement("div"); d.className = "f06-av"; d.id = t[1];
    d.innerHTML = MK.icon(t[0], { size: 62, stroke: 1.8 });
    qs("#f06-team").appendChild(d);
  });

  /* industries chips (two lanes) */
  var ind = ["Real Estate", "Healthcare", "Education", "Retail", "Logistics", "Tourism", "Finance", "Events", "NGOs", "Manufacturing"];
  function laneHtml(list) {
    var s = ""; list.concat(list).forEach(function (t) { s += '<span class="f06-chip">' + t + '</span>'; }); return s;
  }
  qs("#f06-r1").innerHTML = laneHtml(ind);
  qs("#f06-r2").innerHTML = laneHtml(ind.slice().reverse());

  /* ---------- initial states (= handoff_in: board top edge at the bottom) ---------- */
  gsap.set("#f06-board", { y: 1620, rotationY: -9, rotationX: 4, transformPerspective: 2000, transformOrigin: "50% 50%" });
  MK.hide("#f06-tpl"); MK.hide(".f06-av");
  gsap.set("#f06-r1", { x: 40 });
  gsap.set("#f06-r2", { x: -1500 });
  gsap.set("#f06-sweep", { skewX: -18 });

  /* ---------- 0.00 board rises, 3D drift ry -9 -> -4 ---------- */
  tl.to("#f06-board", { y: 0, duration: 1.0, ease: MK.ease.out }, 0);
  tl.to("#f06-board", { rotationY: -4, rotationX: 2, duration: 3.4, ease: "none" }, 0);
  tl.to("#f06-glow", { y: -70, duration: D, ease: "none" }, 0);

  /* columns fill: cards slide in (waterfall), numbers roll */
  MK.reveal(tl, ".f06-card", 0.29, { dir: "up", dist: 46, blur: 8, dur: 0.55, stagger: 0.085 });
  cols.forEach(function (c, i) {
    MK.count(tl, "#f06-n" + i, 0.45 + i * 0.1, 0.9, 0, c.v);
  });

  /* ---------- 1.10 industries chips scroll (linear, finite) ---------- */
  MK.reveal(tl, "#f06-l1", 1.0, { dir: "up", dist: 40, blur: 8, dur: 0.5 });
  MK.reveal(tl, "#f06-l2", 1.14, { dir: "up", dist: 40, blur: 8, dur: 0.5 });
  tl.to("#f06-r1", { x: -1500, duration: 3.3, ease: "none" }, 1.0);
  tl.to("#f06-r2", { x: -300, duration: 3.3, ease: "none" }, 1.0);

  /* ---------- 2.00 / 2.57 / 3.15 : the board re-lays itself out ---------- */
  var times = [2.0, 2.57, 3.15];
  times.forEach(function (T, li) {
    var L = layouts[li + 1], P = layouts[li];
    cols.forEach(function (c, i) {
      tl.to("#f06-col" + i, { x: SX(L.slot[i]), y: L.dy[i], duration: 0.5, ease: MK.ease.out }, T + i * 0.04);
    });
    hiOff(T, P.hi, 0.22);
    hiOn(T + 0.06, L.hi, 0.22);
  });

  /* ---------- 3.45 grey template card drops in, board dims; 4.00 shoved out ---------- */
  gsap.set("#f06-tpl", { rotationZ: -4, transformPerspective: 1800 });
  tl.fromTo("#f06-tpl", { y: -820, opacity: 1, rotationY: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: MK.ease.out, immediateRender: false }, 3.42);
  tl.to("#f06-browser", { opacity: 0.35, scale: 0.97, duration: 0.25, ease: MK.ease.soft }, 3.55);
  tl.to("#f06-tpl", { rotationZ: 2, duration: 0.28, ease: "none" }, 3.72);
  tl.to("#f06-tpl", { x: 1300, rotationZ: 14, filter: "blur(10px)", opacity: 0, duration: 0.36, ease: "power4.in" }, 4.0);
  tl.to("#f06-browser", { opacity: 1, scale: 1, duration: 0.4, ease: MK.ease.out }, 4.0);
  tl.to(".f06-nm, .f06-num", { opacity: 0, duration: 0.12, ease: "none" }, 3.40);
  tl.to(".f06-nm, .f06-num", { opacity: 1, duration: 0.2, ease: "none" }, 4.32);

  /* ---------- 4.29 light sweep, then handoff_out (board 60 %, up, blur 10, avatars at the bottom) ---------- */
  MK.sweep(tl, "#f06-sweep", 4.29, 0.55, -300, 1100);
  MK.exit(tl, "#f06-l1", 4.2, { dur: 0.3, y: 30, blur: 8 });
  MK.exit(tl, "#f06-l2", 4.24, { dur: 0.3, y: 30, blur: 8 });
  tl.to("#f06-board", { scale: 0.6, y: -190, filter: "blur(10px)", duration: 0.5, ease: "power2.inOut" }, 4.32);

  MK.reveal(tl, ".f06-av", 3.85, { dir: "up", dist: 70, blur: 10, dur: 0.55, stagger: 0.1 });
  MK.drawIcon(tl, "#f06-av1 svg", 4.05, { dur: 0.5 });
  MK.drawIcon(tl, "#f06-av2 svg", 4.13, { dur: 0.5 });
  MK.drawIcon(tl, "#f06-av3 svg", 4.21, { dur: 0.5 });

  /* ---------- subtitle (three chunks, box on « template ») ---------- */
  MK.subtitle(tl, "#f06-sub1", [["Custom", 0.29], ["CRM", 0.67], ["solutions", 1.32], ["built", 1.72]], { out: 1.84 });
  MK.subtitle(tl, "#f06-sub2", [["around", 2.0], ["how", 2.27], ["your", 2.43], ["team", 2.76], ["works,", 3.07]], { out: 3.42 });
  MK.subtitle(tl, "#f06-sub3", [["not", 3.69], ["a", 4.04], ["template.", 4.1, true]], { out: D - 0.28 });

  window.__timelines["06-not-template"] = tl;
})();
</script>
