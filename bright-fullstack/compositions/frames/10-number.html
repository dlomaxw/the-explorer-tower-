<script>

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var qs = MK.qs;
  var D = 4.94, H = 150;

  // icons

  qs("#f10-ic2").innerHTML = MK.icon("send", { size: 56, stroke: 2 });
  qs("#f10-ic3").innerHTML = MK.icon("mail", { size: 52, stroke: 2 });

  // digit slots: [digit, spoken cue, line, group break after]
  function addPlus(host) { var p = document.createElement("span"); p.className = "f10-plus"; p.textContent = "+"; host.appendChild(p); return p; }
  function addGap(host) { var g = document.createElement("span"); g.className = "f10-gap"; host.appendChild(g); }
  var in1 = qs("#f10-in1"), in2 = qs("#f10-in2");
  var plus = addPlus(in1);
  var spec = [
    [2, 0.46, in1], [5, 0.65, in1], [6, 0.91, in1], "gap1",
    [7, 1.52, in1], [5, 1.90, in1], [0, 2.14, in1],
    [4, 2.80, in2], [2, 3.10, in2], [1, 3.32, in2], "gap2",
    [2, 3.87, in2], [2, 4.09, in2], [4, 4.29, in2]
  ];
  var slots = [], cols = [];
  spec.forEach(function (s, i) {
    if (s === "gap1") { addGap(in1); return; }
    if (s === "gap2") { addGap(in2); return; }
    var slot = document.createElement("span"); slot.className = "f10-slot";
    var col = document.createElement("div"); col.className = "f10-col";
    for (var k = 0; k < 20; k++) { var c = document.createElement("div"); c.textContent = String(k % 10); col.appendChild(c); }
    slot.appendChild(col); s[2].appendChild(slot);
    slots.push({ slot: slot, col: col, d: s[0], cue: s[1], n: slots.length });
  });

  // initial states (hidden until their beat)
  MK.hide(".f10-slot"); MK.hide(".f10-plus");
  MK.hide("#f10-head > *"); MK.hide("#f10-mail"); MK.hide("#f10-rule");

  tl.fromTo("#f10-card", { clipPath: "inset(0px 0px 242px 0px round 30px)" }, { clipPath: "inset(-80px -80px -80px -80px round 30px)", duration: 0.8, ease: MK.ease.out, immediateRender: false }, 0.04);

  // the question rises out through the top
  tl.to("#f10-q", { y: -460, opacity: 0, filter: "blur(10px)", duration: 0.55, ease: "power2.in" }, 0.04);

  // rings: drawn on, then a slow outward drift (living layer for the whole frame)
  MK.draw(tl, ".f10-ring", 0.05, { dur: 0.9, stagger: 0.12, ease: MK.ease.io });
  tl.fromTo("#f10-rings", { scale: 0.94, transformOrigin: "540px 740px" }, { scale: 1.08, transformOrigin: "540px 740px", duration: D, ease: "none", immediateRender: false }, 0);

  // 0.12 header row
  tl.fromTo("#f10-lab", { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: MK.ease.out, immediateRender: false }, 0.12);
  tl.fromTo("#f10-ic1", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: MK.ease.out, immediateRender: false }, 0.12);
  tl.fromTo("#f10-ic2", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: MK.ease.out, immediateRender: false }, 0.2);
  MK.drawIcon(tl, "#f10-ic1", 0.14, { dur: 0.5 });
  MK.drawIcon(tl, "#f10-ic2", 0.22, { dur: 0.5 });

  // plus sign on its cue
  tl.fromTo(".f10-plus", { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: MK.ease.out, immediateRender: false }, 0.15);

  // digits roll in their slots, each landing just after its spoken cue
  slots.forEach(function (s) {
    var travel = 4 + (s.n % 3) * 2;
    var endIdx = s.d + 10, startIdx = endIdx - travel;
    var t0 = Math.max(0.12, s.cue - 0.34);
    gsap.set(s.col, { y: -startIdx * H });
    tl.fromTo(s.slot, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none", immediateRender: false }, t0);
    tl.fromTo(s.col, { y: -startIdx * H, filter: "blur(5px)" },
      { y: -endIdx * H, filter: "blur(0px)", duration: 0.42, ease: MK.ease.out, immediateRender: false }, t0);
  });

  // 1.30 the accent box closes around "+256 750" (lands on the 1.56 beat), text turns dark on yellow
  tl.fromTo("#f10-box", { opacity: 0, scaleX: 1.12, scaleY: 1.35 }, { opacity: 1, scaleX: 1, scaleY: 1, duration: 0.28, ease: MK.ease.out, immediateRender: false }, 1.30);
  tl.to("#f10-line1", { color: "var(--mk-on-accent)", duration: 0.12, ease: "none" }, 1.38);

  // small hit on each group start: the number block nudges (finite, subtle)
  [0.30, 0.90, 2.00, 3.10].forEach(function (t) {
    tl.fromTo("#f10-number", { y: 0 }, { y: -6, duration: 0.07, ease: "power2.out", immediateRender: false }, t);
    tl.to("#f10-number", { y: 0, duration: 0.3, ease: MK.ease.out }, t + 0.07);
  });

  // divider and email row slide in (on screen only)
  tl.fromTo("#f10-rule", { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: MK.ease.out, immediateRender: false }, 4.05);
  tl.fromTo("#f10-mail", { x: 90, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: MK.ease.out, immediateRender: false }, 4.20);
  MK.drawIcon(tl, "#f10-ic3", 4.26, { dur: 0.5 });
