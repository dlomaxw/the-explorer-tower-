  var CW = 25.2;

  // ---- build the terminal text (mono) ----
  function chars(host, text, cls) {

    for (var i = 0; i < text.length; i++) {
      var s = document.createElement("span");
      s.className = "c" + (cls && i < PROMPT.length ? " p" : "");
      s.textContent = text.charAt(i) === " " ? " " : text.charAt(i);
      host.appendChild(s); out.push(s);
    }
    return out;
  }
  var r1 = chars(qs("#f01-r1"), PROMPT + "npm run build", true);
  var r4 = chars(qs("#f01-r4"), PROMPT, true);
  var r2 = qs("#f01-r2");
  r2.innerHTML = MK.icon("check", { size: 40, stroke: 2.4 }) + '<span id="f01-r2t">Build complete</span>';
  var rt = qs("#f01-rtext");
  "Ready. Your product is live.".split(" ").forEach(function (wd, i, a) {
    var s = document.createElement("span"); s.className = "f01-w"; s.textContent = wd; rt.appendChild(s);
    if (i < a.length - 1) rt.appendChild(document.createTextNode(" "));

  var words3 = rt.querySelectorAll(".f01-w");

  // ---- initial states (nothing visible at t=0) ----
  MK.hide(["#f01-r2", "#f01-hl", "#f01-dot", "#f01-ring", "#f01-scan", "#f01-bar", "#f01-caret2"]);
  gsap.set("#f01-card", { opacity: 0, filter: "blur(12px)", rotationX: -8, rotationY: 30, z: -500, transformPerspective: 2200 });

  // ---- ground: radial fades in ----
  tl.to("#f01-glow", { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);

  // ---- camera: slow push the whole frame (3 percent per second) ----
  var S_END = 1 + 0.03 * D;
  tl.to("#f01-cam", { scale: S_END, duration: D, ease: "none" }, 0);
  // descent from 2.50 (y), blur lives on the objects (cam is too large to blur)
  var CAM_DY = -103;
  tl.to("#f01-cam", { y: CAM_DY, duration: D - 2.5, ease: "power2.in" }, 2.5);

  // ---- 0.00 card arrives from depth, 3D, then drifts ----
  tl.fromTo("#f01-card", { opacity: 0, filter: "blur(12px)", rotationX: -8, rotationY: 30, z: -500, transformPerspective: 2200 },
    { opacity: 1, filter: "blur(0px)", rotationX: 4, rotationY: -6, z: 0, transformPerspective: 2200, duration: 0.8, ease: "expo.out", immediateRender: false }, 0);
  tl.to("#f01-card", { rotationX: 2, rotationY: -2.5, duration: 1.55, ease: "none" }, 0.8);

  // ---- caret 1: blinks, then follows the typing ----
  tl.set("#f01-caret1", { opacity: 0 }, 0.05);
  tl.set("#f01-caret1", { opacity: 1 }, 0.1);
  var T0 = 0.12, STEP = 0.03;
  for (var k = 1; k <= r1.length; k++) {
    tl.set("#f01-caret1", { x: k * CW }, T0 + k * STEP);
  }
  tl.fromTo(r1, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none", stagger: STEP, immediateRender: false }, T0);
  tl.set("#f01-caret1", { opacity: 0 }, 0.98);

  // ---- 1.00 / 1.20 check line pops (blur 8 -> 0) ----
  tl.fromTo("#f01-r2", { opacity: 0, y: 16, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, 1.0);
  MK.drawIcon(tl, "#f01-r2 svg", 1.0, { dur: 0.35 });

  // ---- 1.14 logo mark draws on (scan line + wipe), beat grid ----
  tl.fromTo("#f01-mark", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: "power1.inOut", immediateRender: false }, 1.14);
  tl.set("#f01-scan", { opacity: 1 }, 1.14);
  tl.fromTo("#f01-scan", { y: 0 }, { y: 160, duration: 0.9, ease: "power1.inOut", immediateRender: false }, 1.14);
  tl.to("#f01-scan", { opacity: 0, duration: 0.12, ease: "none" }, 2.04);

  // ---- 1.45 Ready line assembles and lights up ----
  tl.fromTo("#f01-hl", { opacity: 0, scaleX: 0.92 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 1.45);
  tl.fromTo("#f01-dot", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, 1.45);
  tl.fromTo(words3, { opacity: 0, y: 18, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out", stagger: 0.06, immediateRender: false }, 1.47);
  MK.pulse(tl, "#f01-ring", 1.5, { count: 1, scale: 2.4, dur: 0.7 });

  // ---- 1.71 title rises word by word (beat) ----
  MK.headline(tl, "#f01-title", 1.71, { stagger: 0.09, dur: 0.7 });

  // ---- 1.90 new prompt appears, caret 2 blinks (the object-bridge) ----
  tl.fromTo(r4, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none", stagger: 0.012, immediateRender: false }, 1.86);
  tl.set("#f01-caret2", { opacity: 1 }, 1.92);
  tl.set("#f01-caret2", { opacity: 0 }, 2.04);
  tl.set("#f01-caret2", { opacity: 1 }, 2.15);

  // ---- 2.29 caret leaves the card as a yellow bar and falls ----
  var s229 = 1 + 0.03 * 2.29;
  var startCenterY = 960 + (613 - 960) / s229;
  var endCenterY = 960 + (1150 - CAM_DY - 960) / S_END;
  gsap.set("#f01-bar", { y: (startCenterY - 60) - 575, scaleY: 0.37, transformOrigin: "50% 0%" });
  tl.set("#f01-caret2", { opacity: 0 }, 2.29);
  tl.set("#f01-bar", { opacity: 1 }, 2.29);
  tl.fromTo("#f01-bar", { y: (startCenterY - 60) - 575 }, { y: (endCenterY - 60) - 575, duration: D - 2.29, ease: "power2.in", immediateRender: false }, 2.29);
  tl.fromTo("#f01-bar", { scaleY: 0.37 }, { scaleY: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, 2.29);
  tl.fromTo("#f01-bar", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: D - 2.5, ease: "power2.in", immediateRender: false }, 2.5);

  // ---- 2.40 exits: card through the top, mark and title up and out ----

  // glue "Full" and "-stack" into one word (no space node between them)
  var kids = p2.childNodes;

  window.__timelines["01-build"] = tl;
})();
