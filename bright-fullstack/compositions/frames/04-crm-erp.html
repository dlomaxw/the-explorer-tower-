<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var D = 1.45;

  // icons (Closed Won is the single yellow highlight of the beat)
  MK.putIcon("#f04-i0", "user", { size: 64, stroke: 1.9 });
  MK.putIcon("#f04-i1", "clock", { size: 64, stroke: 1.9 });
  MK.putIcon("#f04-i2", "check", { size: 64, stroke: 1.9 });
  MK.putIcon("#f04-i3", "bell", { size: 64, stroke: 1.9 });

  // 1) incoming state = handoff_out of frame 3: the API card scaled x1.3, blurred 12 px, yellow border at its top
  gsap.set("#f04-ghostW", { scale: 1.3, filter: "blur(12px)", opacity: 1, transformOrigin: "50% 50%" });
  MK.hide(".f04-chip");
  MK.hide("#f04-kicker");
  MK.stage3d("#f04-stage", 2200, "50%", "40%");

  // chip geometry: centres of the grid vs the ghost card centre (540, 760)
  var ch = [
    { id: "#f04-c0", dx: 250, dy: 661 },
    { id: "#f04-c1", dx: -250, dy: 661 },
    { id: "#f04-c2", dx: 250, dy: 241 },
    { id: "#f04-c3", dx: -250, dy: 241 }
  ];
  var vals = [24, 12, 8, 6];

  // camera push (drift, whole beat)
  MK.camera(tl, "#f04-cam", 0, D, { scale: 1.1, ease: "none" });

  // ghost card dissolves toward the camera while the chips leave it (container -> hero)
  tl.to("#f04-topline", { y: -220, duration: 0.3, ease: "power2.in" }, 0);
  tl.to("#f04-ghostW", { scale: 1.6, opacity: 0, filter: "blur(18px)", duration: 0.45, ease: "power2.out" }, 0);

  // kicker
  tl.fromTo("#f04-kicker", { opacity: 0, y: -30, filter: "blur(8px)" },
    { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: MK.ease.out, immediateRender: false }, 0.1);

  // 2) four chips drop out of the card, 0.08 s apart (pops 0.05, 0.13, 0.21, 0.29)
  ch.forEach(function (c, i) {
    var at = 0.05 + i * 0.08;
    tl.fromTo(c.id, { x: c.dx, y: c.dy, scale: 1.3, rotationX: -24, filter: "blur(12px)", opacity: 0, transformPerspective: 2200 },
      { x: 0, y: 0, scale: 1, rotationX: 0, filter: "blur(0px)", opacity: 1, duration: 0.55, ease: MK.ease.out, immediateRender: false }, at);
    // icon draws on right after the chip lands
    MK.drawIcon(tl, "#f04-i" + i, at + 0.14, { dur: 0.4, stagger: 0.05 });
    // numbers roll to their value, hit on the 0.31 beat, mid-roll at 0.7
    MK.count(tl, "#f04-n" + i, 0.31 + i * 0.03, 0.75, 0, vals[i], { ease: "power3.out" });
    // thin progress rule under each number grows with it
    tl.fromTo("#f04-" + "c" + i + " .f04-bar i", { scaleX: 0 }, { scaleX: [1, 0.5, 0.33, 0.25][i] * (i === 0 ? 1 : 1), duration: 0.75, ease: "power3.out", immediateRender: false }, 0.31 + i * 0.03);
  });

  // 3) the chips lift out through the top on the 0.88 beat, accelerating, blur 10 px
  ch.forEach(function (c, i) {
    tl.to(c.id, { y: -1750, scale: 1.08, filter: "blur(10px)", duration: 0.48, ease: "power2.in" }, 0.88 + i * 0.03);
  });
  tl.to("#f04-kicker", { y: -1750, filter: "blur(10px)", duration: 0.48, ease: "power2.in" }, 0.88);

  // 4) the yellow pipeline line (6 px) enters from the bottom at x 540, tip ends at y 1700
  tl.fromTo("#f04-line", { y: 0 }, { y: -220, duration: 0.35, ease: "power2.out", immediateRender: false }, 1.1);

  // subtitle: one chunk, key box on CRM, gone 0.12 s before the end
  MK.subtitle(tl, "#f04-sub1", [["Custom", 0.12], ["CRM,", 0.52, true]], { out: D - 0.15 });

  window.__timelines["04-crm-erp"] = tl;
})();
</script>
