<script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var B0 = "blur(0px)", B12 = "blur(12px)";

      // CAMERA: one world wrapper, one writer per leg
      tl.fromTo("#dw03-world", { scale: 1.1, y: 1256, x: 0 }, { scale: 1, y: 0, x: 0, duration: 0.3, ease: "expo.out" }, 0);
      tl.fromTo("#dw03-world", { scale: 1, y: 0, x: 0 }, { scale: 1.054, y: 0, x: 0, duration: 1.34, ease: "none", immediateRender: false }, 0.3);
      tl.fromTo("#dw03-world", { scale: 1.054, y: 0, x: 0 }, { scale: 1.3, y: -150, x: -300, duration: 1.03, ease: "expo.in", immediateRender: false }, 1.64);

      // blur on the travelling layers (handoff in: 12 px, handoff out: 12 px)
      tl.fromTo(["#dw03-pane", "#dw03-strip", "#dw03-mull", "#dw03-node"], { filter: B12 }, { filter: B0, duration: 0.3, ease: "expo.out" }, 0);
      tl.fromTo("#dw03-pane", { filter: B0 }, { filter: B12, duration: 1.03, ease: "power2.in", immediateRender: false }, 1.64);

      // label bar
      tl.fromTo("#dw03-bar", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, 0.45);
      tl.to("#dw03-bar", { opacity: 0, y: 40, duration: 0.18, ease: "power2.in" }, 2.1);

      // chips
      var chips = document.querySelectorAll(".dw03-chip");
      for (var i = 0; i < chips.length; i++) {
        tl.fromTo(chips[i], { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.22, ease: "expo.out", immediateRender: false }, 0.9 + i * 0.1);
      }

      // leaf swings open (hinge on its right edge), curtain wall behind
      tl.fromTo("#dw03-leaf", { rotationY: 0, transformPerspective: 1400 }, { rotationY: -70, transformPerspective: 1400, duration: 0.5, ease: "power3.out", immediateRender: false }, 1.64);
      // the opening grows to fill the screen
      tl.fromTo("#dw03-curtain", { scale: 1 }, { scale: 2.1, duration: 0.67, ease: "power3.in", immediateRender: false }, 2.0);

      // subtitle, word by word (0 to 2 frames early)
      var cues = [0.25, 0.65, 0.79, 1.36, 1.64, 1.89, 2.0];
      var words = document.querySelectorAll(".dw03-t");
      for (var j = 0; j < words.length; j++) {
        var t0 = Math.max(0, cues[j] - 0.03);
        tl.fromTo(words[j], { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 0.4, y: 0, filter: B0, duration: 0.14, ease: "power3.out", immediateRender: false }, t0);
        tl.to(words[j], { opacity: 1, duration: 0.2, ease: "power1.out" }, t0 + 0.14);
      }
      // key-word box on "open"
      tl.fromTo("#dw03-boxopen", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.57);
      tl.set("#dw03-boxopen", { opacity: 1 }, 1.57);
      // subtitle leaves before the seam
      tl.to("#dw03-sub", { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.45);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-doors-windows"] = tl;
    })();
