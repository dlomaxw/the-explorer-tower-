<script>
(function () {

  /* dash setup (lengths are the exact perimeters, no layout dependency) */
  var dashes = { "sixty-leadframe": 3832, "sixty-doorsf": 1932, "sixty-windowsf": 1932, "sixty-stripf": 2672, "sixty-bridgep": 1020, "sixty-ulinep": 260 };

    var p = $(id), L = dashes[id];
    p.style.strokeDasharray = L + " " + L;
    p.style.strokeDashoffset = L;
  });
  function draw(id, at, dur, ease) {
    tl.to($(id), { strokeDashoffset: 0, duration: dur, ease: ease || "expo.out" }, at);
  }

  /* ---------- CAMERA (one wrapper, sequential legs, apart from object tweens) ---------- */
  var world = $("sixty-world");
  tl.to(world, { y: -114, duration: 1.9, ease: "none" }, 0);
  tl.to(world, { y: -200, duration: 0.6, ease: "expo.inOut" }, 1.9);

  /* 0.05 pane-large frame draws, photo arrives, counter chip, roll 0 to 60 */

  tl.fromTo($("sixty-leadph"), { opacity: 0, scale: 1.15, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, 0.18);
  tl.fromTo($("sixty-leadph").parentNode, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, 0.18);

  tl.fromTo($("sixty-chip"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.2);
  tl.fromTo($("sixty-yrs"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.3);

    tl.fromTo(clip, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, t0 + 0.12);
    tl.fromTo(ph, { scale: 1.15, filter: "blur(14px)" }, { scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, t0 + 0.12);
    tl.fromTo(bar, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.15, ease: "power3.out", immediateRender: false }, t0 + 0.3);
  }
  pane("sixty-doors", "sixty-doorsf", 2.06);
  pane("sixty-windows", "sixty-windowsf", 2.77);
  pane("sixty-strip", "sixty-stripf", 3.56);
