<script>

      var tl = gsap.timeline({ paused: true });
      var B0 = "blur(0px)", B6 = "blur(6px)", B12 = "blur(12px)", B14 = "blur(14px)";
      var NR = { immediateRender: false };
      function mk(o) { for (var k in NR) o[k] = NR[k]; return o; }

      // ---------- CAMERA (one world wrapper; zoom/x and y as sequential legs) ----------
      // handoff in: x1.3, downward move, blur 12
      tl.fromTo("#cw04-world", { scale: 1.3, x: -300 }, { scale: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#cw04-world", { y: -150 }, { y: -240, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#cw04-world", { y: -240 }, mk({ y: -320, duration: 0.8, ease: "none" }), 0.5);
      tl.fromTo("#cw04-world", { y: -320 }, mk({ y: -520, duration: 0.54, ease: "expo.inOut" }), 1.3);
      tl.fromTo("#cw04-world", { y: -520 }, mk({ y: -505, duration: 0.86, ease: "none" }), 1.84);
      tl.fromTo("#cw04-world", { y: -505 }, mk({ y: -405, duration: 0.7, ease: "power1.inOut" }), 2.7);
      tl.fromTo("#cw04-world", { y: -405 }, mk({ y: -838, duration: 0.52, ease: "power1.in" }), 3.4);

      // ---------- DEPTH OF FIELD ----------
      tl.fromTo("#cw04-p1", { filter: B12 }, { filter: B0, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#cw04-p2", { filter: B0 }, mk({ filter: B12, duration: 0.52, ease: "power1.in" }), 3.4);

      // ---------- SCENE 1 ----------
      // 0.00 the opening completes into the curtain wall pane
      tl.fromTo("#cw04-p1cw", { clipPath: "inset(0px 0px 0px 458px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: 0.5, ease: "expo.out" }, 0);
      // 0.40 label bar
      tl.fromTo("#cw04-p1barin", { opacity: 0, y: 20 }, mk({ opacity: 1, y: 0, duration: 0.15, ease: "power3.out" }), 0.4);
      // 0.80 chips
      var chips = ["#cw04-chip1", "#cw04-chip2", "#cw04-chip3"];
      for (var c = 0; c < 3; c++) {
        tl.fromTo(chips[c], { opacity: 0, y: 20 }, mk({ opacity: 1, y: 0, duration: 0.2, ease: "expo.out" }), 0.8 + c * 0.1);
      }
      // 1.17 the lower frame line extends into the facade pane (bridge, svg-path-draw)
      tl.set("#cw04-p2frame", { opacity: 1 }, 1.17);
      tl.fromTo("#cw04-p2frame", { strokeDashoffset: 3832 }, mk({ strokeDashoffset: 0, duration: 0.4, ease: "expo.out" }), 1.17);
      tl.fromTo(["#cw04-node1", "#cw04-node2"], { opacity: 0, scale: 0 }, mk({ opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }), 1.17);
      // photo arrives from x1.15 + blur 14
      tl.fromTo("#cw04-p2back", { opacity: 0 }, mk({ opacity: 1, duration: 0.05, ease: "none" }), 1.35);
      tl.fromTo("#cw04-fins", { opacity: 0, scale: 1.15, filter: B14 }, mk({ opacity: 1, scale: 1, filter: B0, duration: 0.2, ease: "expo.out" }), 1.35);
      // 1.50 label « Facade. »
      tl.fromTo("#cw04-p2barin", { opacity: 0, y: 20 }, mk({ opacity: 1, y: 0, duration: 0.15, ease: "power3.out" }), 1.5);

      // ---------- SCENE 2 ----------
      // 2.00 fins photo slides up inside its frame (parallax 60 px)
      tl.fromTo("#cw04-fins", { y: 0 }, mk({ y: -60, duration: 0.6, ease: "power3.out" }), 2.0);
      // 2.30 sun shading photo slides in from the bottom as a second layer
      tl.fromTo("#cw04-sun", { opacity: 0, y: 900, scale: 1.15, filter: B14 }, mk({ opacity: 1, y: 0, scale: 1, filter: B0, duration: 0.5, ease: "expo.out" }), 2.3);
      // 2.70 tilt up along the photo: two layers parallax
      tl.fromTo("#cw04-sun", { y: 0 }, mk({ y: 40, duration: 0.7, ease: "power1.inOut" }), 2.8);
      tl.fromTo("#cw04-fins", { y: -60 }, mk({ y: -100, duration: 0.7, ease: "power1.inOut" }), 2.8);
      // 3.40 the glass line enters from the bottom
      tl.set("#cw04-strips", { opacity: 1 }, 3.38);
      tl.fromTo("#cw04-strips", { y: 110 }, mk({ y: 0, duration: 0.52, ease: "none" }), 3.4);

      // ---------- SUBTITLE ----------
      tl.fromTo("#cw04-scrim", { opacity: 0 }, mk({ opacity: 1, duration: 0.2, ease: "power1.out" }), 0.2);
      tl.to("#cw04-scrim", { opacity: 0, duration: 0.14, ease: "power2.in" }, 3.7);

      function words(sel, cues) {
        var ws = document.querySelectorAll(sel + " .cw04-t");
        for (var j = 0; j < ws.length; j++) {
          var t0 = cues[j] - 0.03;
          tl.fromTo(ws[j], { opacity: 0, y: 8, filter: B6 }, mk({ opacity: 0.4, y: 0, filter: B0, duration: 0.14, ease: "power3.out" }), t0);
          tl.to(ws[j], { opacity: 1, duration: 0.2, ease: "power1.out" }, t0 + 0.14);
        }
      }
      words("#cw04-c1", [0.30, 0.60, 1.07, 1.17]);
      words("#cw04-c2", [1.86, 2.02, 2.38, 2.49, 3.10]);
      tl.fromTo("#cw04-box1", { scaleX: 0 }, mk({ scaleX: 1, duration: 0.16, ease: "power3.out" }), 1.12);
      tl.fromTo("#cw04-box2", { scaleX: 0 }, mk({ scaleX: 1, duration: 0.16, ease: "power3.out" }), 3.05);
      // chunk 1 leaves, chunk 2 takes the band
      tl.to("#cw04-c1", { opacity: 0, filter: B6, duration: 0.14, ease: "power2.in" }, 1.7);
      tl.set("#cw04-c2", { opacity: 1 }, 1.84);
      tl.to("#cw04-c2", { opacity: 0, filter: B6, duration: 0.14, ease: "power2.in" }, 3.7);
