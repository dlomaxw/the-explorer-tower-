<script>
(function(){
  var tl = gsap.timeline({ paused: true });
  var D = 4.17;

  function split(id, text, dotLast){
    var el = document.getElementById(id), html = "";
    for (var i = 0; i < text.length; i++){
      var ch = text.charAt(i);
      html += '<span' + (dotLast && i === text.length - 1 ? ' class="a12-dot"' : '') + '>' + (ch === " " ? "&nbsp;" : ch) + '</span>';
    }
    el.innerHTML = html;
    return el.querySelectorAll("span");
  }
  var nameL = split("a12-name", "Casements.", true);
  var l2L = split("a12-l2", "5th Street", false);
  var l3L = split("a12-l3", "Industrial Area, Kampala", false);

  /* ---- handoff_in: previous frame lifts out through the top (faster for the lower chips) ---- */
  tl.fromTo("#a12-pmark", { y: 0 }, { y: -500, duration: 0.5, ease: "power2.in", immediateRender: false }, 0);
  tl.fromTo("#a12-ph1", { y: 0 }, { y: -800, duration: 0.5, ease: "power2.in", immediateRender: false }, 0);
  tl.fromTo("#a12-ph2", { y: 0 }, { y: -900, duration: 0.5, ease: "power2.in", immediateRender: false }, 0);
  tl.fromTo("#a12-c1,#a12-c2", { y: 0 }, { y: -1300, duration: 0.6, ease: "power2.in", immediateRender: false }, 0);
  tl.fromTo("#a12-c3,#a12-c4", { y: 0 }, { y: -1600, duration: 0.6, ease: "power2.in", immediateRender: false }, 0);

  /* ---- plate rises from the bottom edge and settles at y 220 ---- */
  tl.fromTo("#a12-plate", { y: 1800, scale: 1.1, filter: "blur(10px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.72, ease: "expo.out", immediateRender: false }, 0);
  /* slow push inside the plate */
  tl.fromTo("#a12-logo", { scale: 1 }, { scale: 1.05, duration: 3.9, ease: "none", immediateRender: false }, 0);

  /* 0.22 pulse: the frame lines draw a second time, Casements. types in */
  tl.fromTo("#a12-pulse-r", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, 0.22);
  tl.to("#a12-pulse-r", { opacity: 0, duration: 0.25, ease: "power1.out" }, 0.62);
  tl.fromTo(nameL, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.034, immediateRender: false }, 0.22);

  /* 0.80 micro tag slides in */
  tl.fromTo("#a12-tag", { opacity: 0, x: 40, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out", immediateRender: false }, 0.8);

  /* 1.30 bridge then the address card frame draws */
  tl.fromTo("#a12-bridge-l", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.16, ease: "expo.out", immediateRender: false }, 1.26);
  tl.fromTo("#a12-node", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, 1.36);
  tl.fromTo("#a12-frame-r", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, 1.3);

  /* card fills, Plot 86 rolls in on "eighty-six" */
  tl.fromTo("#a12-fill", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.6);
  tl.fromTo("#a12-l1s", { opacity: 0, yPercent: 105 }, { opacity: 1, yPercent: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, 1.66);
  /* 5th Street types in on "fifth street" */
  tl.fromTo(l2L, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.04, immediateRender: false }, 2.38);
  /* Industrial Area, Kampala types in on "area" */
  tl.fromTo(l3L, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.022, immediateRender: false }, 3.57);

  /* ---- subtitle, word by word on the cues (0 to 2 frames early) ---- */
  function word(id, cue, boxed){
    var t = cue - 0.03;
    if (boxed){
      tl.fromTo(id, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out", immediateRender: false }, t);
    } else {
      tl.fromTo(id, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 0.4, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out", immediateRender: false }, t);
      tl.to(id, { opacity: 1, duration: 0.2, ease: "power1.out" }, t + 0.14);
    }
  }
  word("#a12-w1", 1.19, false);
  word("#a12-w2", 1.46, false);
  tl.to("#a12-w2", { opacity: 1, duration: 0.12, ease: "power1.out" }, 1.62);
  word("#a12-w3", 1.70, true);
  word("#a12-w3c", 1.70, true);
  word("#a12-w4", 2.40, false);
  word("#a12-w5", 2.54, false);
  word("#a12-w6", 2.99, false);
  word("#a12-w7", 3.63, true);
  tl.fromTo("#a12-box1", { opacity: 1, scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.64);

  tl.fromTo("#a12-bridge", { y: 0, filter: "blur(0px)" }, { y: -81, filter: "blur(6px)", duration: 0.27, ease: "none", immediateRender: false }, 3.9);

  tl.set({}, {}, D);
