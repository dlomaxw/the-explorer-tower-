  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var B0 = "blur(0px)", B12 = "blur(12px)";
      var CAM = "#f06steel-cam";

      // CAMERA TRACK (one writer, one leg at a time): in = 90%/s descent, out = 90%/s descent
      tl.fromTo(CAM, { y: 0 }, { y: -1190, duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo(CAM, { y: -1190 }, { y: -1710, duration: 0.4, ease: "expo.inOut", immediateRender: false }, 0.8);
      tl.fromTo(CAM, { y: -1710 }, { y: -1760, duration: 0.5, ease: "none", immediateRender: false }, 1.2);
      tl.fromTo(CAM, { y: -1760 }, { y: -2280, duration: 0.4, ease: "expo.inOut", immediateRender: false }, 1.7);
      tl.fromTo(CAM, { y: -2280 }, { y: -2340, duration: 0.6, ease: "none", immediateRender: false }, 2.1);
      tl.fromTo(CAM, { y: -2340 }, { y: -2590, duration: 0.29, ease: "power2.in", immediateRender: false }, 2.7);

      // HANDOFF IN: travelling layers start blurred 12 px, gates x1.1 from its top edge
      tl.fromTo(["#f06steel-rail", "#f06steel-lv0", "#f06steel-hl0", "#f06steel-gates"], { filter: B12 }, { filter: B0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#f06steel-gates", { scale: 1.1 }, { scale: 1, duration: 0.7, ease: "expo.out" }, 0);
      tl.fromTo("#f06steel-gimg", { scale: 1.15 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0);

      // HANDOFF OUT: everything travelling blurs to 12 px as the camera accelerates
      tl.fromTo(["#f06steel-grille", "#f06steel-roller", "#f06steel-lv2", "#f06steel-lv1", "#f06steel-n1", "#f06steel-n2"], { filter: B0 }, { filter: B12, duration: 0.29, ease: "power2.in", immediateRender: false }, 2.7);
      tl.set("#f06steel-ceil", { scale: 1.1, opacity: 1 }, 1.95);

      // SEAM: first image = last image of frame 5 (railings pane leaving, mullion bar only); bridge, node and gates join 1 frame later
      tl.set(["#f06steel-lv0", "#f06steel-n0", "#f06steel-gates"], { opacity: 1 }, 0.03);
      tl.fromTo("#f06steel-rail", { y: 0 }, { y: -420, duration: 0.14, ease: "power2.out" }, 0);

      // labels (waterfall: binary opacity, whip from below, one direction)
      function label(bar, words, t, barT) {
        tl.fromTo(bar, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.15, ease: "power3.out", immediateRender: false }, barT);
        for (var i = 0; i < words.length; i++) {
          var ts = t + i * 0.06;
          tl.set(words[i], { opacity: 1, y: 56 }, ts);
          tl.to(words[i], { y: 0, duration: 0.16, ease: "power4.out" }, ts);
        }
      }
      function q(sel) { return document.querySelectorAll(sel); }
      label("#f06steel-gbar", q("#f06steel-gbar .f06steel-lw"), 0.30, 0.25);
      label("#f06steel-gr-bar", q("#f06steel-gr-bar .f06steel-lw"), 1.50, 1.45);
      label("#f06steel-ro-bar", q("#f06steel-ro-bar .f06steel-lw"), 2.25, 2.20);

      // pane draw-on: frame lines, then photo (x1.15 + blur 14 -> sharp), then label (above)
      function pane(prefix, tDraw, tPhoto) {
        tl.to("#f06steel-" + prefix + "-fr", { strokeDashoffset: 0, duration: 0.3, ease: "expo.out" }, tDraw);
        tl.set(["#f06steel-" + prefix + "-sh", "#f06steel-" + prefix + "-ph"], { opacity: 1 }, tPhoto);
        tl.fromTo("#f06steel-" + prefix + "-img", { scale: 1.15, filter: "blur(14px)" }, { scale: 1, filter: B0, duration: 0.2, ease: "expo.out", immediateRender: false }, tPhoto);
      }
      pane("gr", 0.95, 1.05);
      pane("ro", 1.91, 2.01);

      // mullion bridges (svg-path-draw) + black nodes
      function bridge(line, node, t, dur) {
        tl.to("#f06steel-" + line + " path", { strokeDashoffset: 0, duration: dur, ease: "expo.out" }, t);
        tl.fromTo("#f06steel-" + node, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.15, ease: "power3.out", immediateRender: false }, t + 0.2);
      }
      bridge("lv1", "n1", 0.95, 0.4);
      bridge("lv2", "n2", 1.91, 0.4);
      bridge("lv3", "n3", 2.70, 0.3);
      tl.to("#f06steel-hl3 path", { strokeDashoffset: 0, duration: 0.25, ease: "expo.out" }, 2.72);

      // subtitle, word by word (0 to 2 frames early) + scrim for the band
      var cues = [0.18, 0.59, 1.11, 1.78, 1.91, 2.25];
      var words = q(".f06steel-t");
      for (var j = 0; j < words.length; j++) {
        var t0 = Math.max(0, cues[j] - 0.03);
        tl.fromTo(words[j], { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 0.4, y: 0, filter: B0, duration: 0.14, ease: "power3.out", immediateRender: false }, t0);
        tl.to(words[j], { opacity: 1, duration: 0.2, ease: "power1.out" }, t0 + 0.14);
      }
      tl.fromTo("#f06steel-scrim", { opacity: 0 }, { opacity: 0.94, duration: 0.14, ease: "power3.out", immediateRender: false }, 0.15);
      // key-word box on "grills"
      tl.set("#f06steel-box", { opacity: 1 }, 1.08);
      tl.fromTo("#f06steel-box", { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.08);
      // subtitle leaves before the seam
      tl.to("#f06steel-sub", { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.6);
      tl.to("#f06steel-scrim", { opacity: 0, duration: 0.14, ease: "power2.in" }, 2.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-steel"] = tl;
    })();
  </script>
