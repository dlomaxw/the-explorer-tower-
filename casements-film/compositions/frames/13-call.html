<script src="assets/vendor/gsap.min.js"></script>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var FE = 1/30;

  // ---- number slots ----
  var row = document.getElementById("c13-row");
  var chars = "+256 752 700 700";
  // cue (frame-local s) per digit, + at plus cue
  var cues = [0.46, 0.84, 1.03, 1.28, null, 1.91, 2.23, 2.54, null, 3.05, 3.45, 3.73, null, 4.25, 4.66, 4.94];
  var X = 0, slots = [];
  for (var i = 0; i < chars.length; i++) {
    var ch = chars[i], w;
    if (ch === " ") { X += 0.3 * 80; continue; }
    w = (ch === "+" ? 0.62 : 0.68) * 80;
    var s = document.createElement("span");
    s.className = "c13-s"; s.id = "c13-s" + i;
    s.style.left = X + "px"; s.style.width = w + "px";
    s.textContent = ch;
    row.appendChild(s);
    slots.push({ el: s, ch: ch, cue: cues[i] });
    X += w;
  }
  slots.forEach(function (o) {
    var el = o.el, t = o.cue;
    tl.fromTo(el, { opacity: 0, x: -18, y: 22, filter: "blur(5px)" },
      { opacity: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, t);
    if (o.ch !== "+") {
      var fin = +o.ch, p = { v: 0 };
      tl.fromTo(p, { v: 0 }, { v: 1, duration: 0.3, ease: "power3.out", immediateRender: false,
        onUpdate: function () {
          var k = Math.floor((1 - p.v) * 12);
          el.textContent = String((fin + k * 3) % 10);
        } }, t);
    }
  });

  // yellow box behind "+256 752": closes around +256 first, then 752
    tl.fromTo("#c13-box", { scaleX: 0, opacity: 0 }, { scaleX: 0.53, opacity: 1, duration: 0.25, ease: "expo.out", immediateRender: false }, 1.6);
  tl.to("#c13-box", { scaleX: 1, duration: 0.3, ease: "expo.out" }, 2.5);

  // labels typed
  function typed(id, text, at) {
    var host = document.getElementById(id);
    for (var i = 0; i < text.length; i++) {
      var sp = document.createElement("span"); sp.className = "c13-l"; sp.textContent = text[i]; host.appendChild(sp);
    }
    tl.fromTo("#" + id + " .c13-l", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", stagger: 0.06, immediateRender: false }, at);
  }
  typed("c13-call", "CALL", 0.2 - FE);
  typed("c13-open", "OPEN", 4.2);

  // hours + underline
  tl.fromTo("#c13-hours", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, 4.3 - FE);
  tl.fromTo("#c13-line", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, 5.0 - FE);

  // ---- handoff in: previous cards slide up, contact card rises ----
  tl.fromTo("#c13-prev", { y: 0, filter: "blur(2px)" }, { y: -45, filter: "blur(5px)", duration: 0.15, ease: "none" }, 0);
  tl.to("#c13-prev", { y: -1150, filter: "blur(10px)", duration: 0.5, ease: "power2.in" }, 0.15);
  tl.fromTo("#c13-card", { y: 1300, filter: "blur(10px)" }, { y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0);
  // mark settles above the card at 40% (handoff out)
  tl.fromTo("#c13-mark", { opacity: 0, y: 30 }, { opacity: 0.4, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 0.5);

  // ---- camera: slow push, then push toward 1.05 with blur 4 at the seam ----
  tl.fromTo("#c13-cam", { scale: 1 }, { scale: 1.035, duration: 5.1, ease: "none" }, 0);
  tl.to("#c13-cam", { scale: 1.05, duration: 0.41, ease: "power2.in" }, 5.1);
  tl.to("#c13-card", { filter: "blur(4px)", duration: 0.41, ease: "power2.in" }, 5.1);

  // ---- subtitle ----
  function build(chId, words, boxes) {
    var p = document.querySelector("#" + chId + " p");
    words.forEach(function (w, i) {
      var wd = document.createElement("span"); wd.className = "c13-wd";
      if (boxes[i] !== undefined) { var k = document.createElement("i"); k.className = "c13-k"; k.id = chId + "-k" + i; wd.appendChild(k); }
      var t = document.createElement("span"); t.className = "c13-w"; t.id = chId + "-w" + i; t.textContent = w[0];
      wd.appendChild(t); p.appendChild(wd);
      if (i < words.length - 1) p.appendChild(document.createTextNode(" "));
      var cue = w[1];
      if (boxes[i] !== undefined) tl.fromTo("#" + chId + "-k" + i, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.16, ease: "power3.out", immediateRender: false }, Math.max(0, cue - 2 * FE));
      tl.fromTo(t, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out", immediateRender: false }, cue - FE);
      tl.to(t, { color: "#101010", duration: 0.2, ease: "power2.out" }, cue - FE + 0.14);
    });
  }
  build("c13-ch1", [["call",0.20],["plus",0.46],["two",0.86],["five",1.05],["six",1.30]], {4:1});
  build("c13-ch2", [["seven",1.93],["five",2.25],["two,",2.56],["seven",3.07],["zero",3.47],["zero,",3.75],["seven",4.27],["zero",4.68],["zero",4.96]], {2:1,5:1,8:1});
  // key words' box text turns ink via color tween above; chunk 1 leaves before chunk 2, chunk 2 leaves before the seam
  tl.to("#c13-ch1", { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.75);
  tl.fromTo("#c13-ch2", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in", immediateRender: false }, 5.34);

  window.__timelines["13-call"] = tl;
})();
