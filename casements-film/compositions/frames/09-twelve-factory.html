<script>
  (function(){
    var tl = gsap.timeline({ paused: true });

    // Camera: one monotone push 1.0 -> 1.15 (3 %/s, then 5 %/s, final push)

    tl.to("#f09-cam", {scale:1.13, duration:0.9, ease:"none"}, 2.5);
    tl.to("#f09-cam", {scale:1.15, duration:0.42, ease:"power3.out"}, 3.4);

    // Grid: starts blurred 8 px from the pull-back, sharp in 0.4 s

    // Seam: the big mini-home pane of frame 8 settles into cell 1 and the ground lightens

    tl.to("#f09-shade", {opacity:0, duration:0.4, ease:"power3.out"}, 0);

    // Fill cascade, one cell every 0.1 s from 0.30
    for (var i = 2; i <= 12; i++) {
      var at = 0.30 + (i - 2) * 0.1;
      tl.fromTo("#f09-pn" + i + " img", {opacity:0, scale:1.15, filter:"blur(14px)"}, {opacity:1, scale:1, filter:"blur(0px)", duration:0.2, ease:"expo.out", immediateRender:false}, at);
      tl.fromTo("#f09-pn" + i, {scale:1.05}, {scale:1, duration:0.2, ease:"power3.out", immediateRender:false}, at);
    }

    // Numeral 12 rolls in at 1.6 over a pale scrim (counting-dynamic-scale)
    var st = {v:0};
    tl.fromTo("#f09-plate", {opacity:0}, {opacity:1, duration:0.2, ease:"power3.out", immediateRender:false}, 1.6);
    tl.fromTo("#f09-numwrap", {opacity:0}, {opacity:1, duration:0.15, ease:"power3.out", immediateRender:false}, 1.6);
    tl.to(st, {v:12, duration:0.85, ease:"power3.out", onUpdate:function(){ $("#f09-num").textContent = String(Math.round(st.v)); }}, 1.6);
    tl.fromTo("#f09-num", {scale:0.55}, {scale:1, duration:0.85, ease:"power3.out", immediateRender:false}, 1.6);

    // 2.20 grid frame lines push outward
    tl.fromTo("#f09-grid", {scale:1}, {scale:1.03, duration:0.3, ease:"power2.out", immediateRender:false}, 2.2);

    // 2.50 dissolve: numeral + photos out fast, frames converge to the centre
    tl.to("#f09-plate", {opacity:0, duration:0.15, ease:"power3.in"}, 2.5);
    tl.to("#f09-numwrap", {opacity:0, duration:0.15, ease:"power3.in"}, 2.5);
    tl.to(".f09-pn img", {opacity:0, duration:0.18, ease:"power3.in"}, 2.5);
    for (var j = 1; j <= 12; j++) {
      var el = $("#f09-pn" + j);
      var cx = parseFloat(el.style.left) + 150, cy = parseFloat(el.style.top) + parseFloat(el.style.height || 300) / 2;
      tl.to(el, {x:540 - cx, y:960 - cy, scale:0.35, opacity:0, duration:0.5, ease:"expo.in"}, 2.5);
    }

    // The outline (pane-large) draws clockwise

    tl.fromTo("#f09-bb", {scaleX:0, opacity:1}, {scaleX:1, opacity:1, duration:0.3, ease:"expo.out", immediateRender:false}, 2.86);
    tl.fromTo("#f09-bl", {scaleY:0, opacity:1}, {scaleY:1, opacity:1, duration:0.3, ease:"expo.out", immediateRender:false}, 2.94);

    // 2.60 factory photo arrives x1.15 blurred -> sharp; 3.40 push to blur 10

    tl.fromTo("#f09-photo img", {scale:1.15, filter:"blur(14px)"}, {scale:1, filter:"blur(0px)", duration:0.2, ease:"expo.out", immediateRender:false}, 2.6);
    tl.fromTo("#f09-pscrim", {opacity:0}, {opacity:1, duration:0.2, ease:"expo.out", immediateRender:false}, 2.6);
    tl.to("#f09-photo img", {filter:"blur(10px)", duration:0.42, ease:"power3.out"}, 3.4);

    tl.fromTo("#f09-node", {opacity:0, scale:0.2}, {opacity:1, scale:1, duration:0.2, ease:"expo.out", immediateRender:false}, 3.4);
    tl.fromTo("#f09-mu", {scaleY:0, opacity:1}, {scaleY:1, opacity:1, duration:0.4, ease:"expo.out", immediateRender:false}, 3.4);

    // Subtitle (cues minus ~1.5 frames), key-word boxes first
    var cues = {w1:0.24, w2:0.63, w3:1.03, w4:1.82, w5:2.06, w6:2.89, w7:3.01};
    tl.fromTo("#f09-band", {opacity:0}, {opacity:1, duration:0.2, ease:"power3.out", immediateRender:false}, 0.12);

      tl.fromTo(w, {opacity:0, y:8, filter:"blur(6px)"}, {opacity:0.4, y:0, filter:"blur(0px)", duration:0.14, ease:"power3.out", immediateRender:false}, t);

    tl.to("#f09-s1", {opacity:0, filter:"blur(6px)", duration:0.14, ease:"power3.in"}, 1.64);
