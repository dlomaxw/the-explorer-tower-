<script src="assets/vendor/gsap.min.js"></script>
<script>
(function(){
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var $ = function(id){ return document.getElementById(id); };

  // camera: slow push 4%/s, then ascent back to 1.0 with the lift
  tl.fromTo("#f11-cam", { scale: 1 }, { scale: 1.104, duration: 2.6, ease: "none" }, 0);
  tl.fromTo("#f11-cam", { scale: 1.104 }, { scale: 1, duration: 0.42, ease: "power1.in", immediateRender: false }, 2.6);
  tl.fromTo("#f11-lift", { y: 0, filter: "blur(0px)" }, { y: -105, filter: "blur(10px)", duration: 0.42, ease: "power1.in", immediateRender: false }, 2.6);

  // 0.00 mark from handoff (centre) to top centre
  tl.fromTo("#f11-mark", { y: 720 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);

  // 0.20 Built to last. (slam: x1.5 blurred 18 -> settle)
  tl.fromTo("#f11-d1", { scale: 1.5, filter: "blur(18px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out", immediateRender: false }, 0.2);

  // counting helper (value + scale share timing and ease)
  function roll(vid, sid, target, at, dur){
    var st = { v: 0 }, el = $(vid);
    tl.to(st, { v: target, duration: dur, ease: "power3.out", onUpdate: function(){ el.textContent = Math.round(st.v).toLocaleString("en-US"); } }, at);
    tl.fromTo(el, { scale: 0.55 }, { scale: 1, duration: dur, ease: "power3.out", immediateRender: false }, at);
    tl.fromTo($(sid), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, at + dur);
  }
  function chip(cid, lid, x, at){
    tl.fromTo(cid, { x: x, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, at);
    tl.fromTo(lid, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, at + 0.1);
  }

  // 0.60 chips 1 and 2
  chip("#f11-c1", "#f11-l1", -260, 0.6);
  roll("f11-v1", "f11-s1", 60, 0.6, 0.8);
  chip("#f11-c2", "#f11-l2", 260, 0.7);
  tl.fromTo("#f11-v2", { scale: 0.55 }, { scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 0.7);

  // 1.44 Delivered as promised. lands (rise + blur, different axis)
  tl.fromTo("#f11-d2", { y: 90, scale: 1.25, filter: "blur(16px)", opacity: 0 }, { y: 0, scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 1.44);

  // 1.80 chips 3 and 4
  chip("#f11-c3", "#f11-l3", -260, 1.8);
  roll("f11-v3", "f11-s3", 500, 1.8, 0.75);
  chip("#f11-c4", "#f11-l4", 260, 1.9);
  roll("f11-v4", "f11-s4", 100, 1.9, 0.65);

  window.__timelines["11-built-to-last"] = tl;
})();
</script>
