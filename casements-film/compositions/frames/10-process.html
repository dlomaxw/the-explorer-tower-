  <script>
  (function(){
    var tl = gsap.timeline({ paused: true });
    var $ = function(s){ return document.querySelector(s); };
    gsap.set(".p10-n", {yPercent:100});
    function ft(sel, a, b, pos){ b.immediateRender = false; tl.fromTo(sel, a, b, pos); }

    // ---- setup: measure every path once, set its dash pattern ----
    var dashed = {};
    function prep(id, startFrac){
      var p = $(id); var len = p.getTotalLength() * 1.02;
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len * (startFrac === undefined ? 1 : startFrac);
      dashed[id] = len;

    ["#p10-sk1","#p10-sk2","#p10-sk3","#p10-sk4","#p10-dr1","#p10-dr2","#p10-dr3","#p10-dr4",

    prep("#p10-ol", 0.22); // outline is still finishing its draw at t=0 (handoff_in)
    function draw(id, dur, pos){ tl.to(id, {strokeDashoffset:0, duration:dur, ease:"power2.out"}, pos); }

    // ---- handoff_in settle: outline completes, foreground frame passes the lens ----
    draw("#p10-ol", 0.3, 0);
    tl.to("#p10-fg", {scale:1.35, opacity:0, duration:0.9, ease:"power2.out"}, 0);
    tl.to("#p10-tag", {opacity:0, duration:0.2, ease:"power3.in"}, 0.4);

    tl.to("#p10-cam", {scale:1.032, duration:0.8, ease:"power2.out"}, 1.62);
    tl.to("#p10-cam", {scale:1.048, duration:0.8, ease:"power2.out"}, 2.50);
    tl.to("#p10-cam", {scale:1.064, duration:0.5, ease:"power2.out"}, 3.37);
    tl.to("#p10-cam", {scale:1.0, y:0, duration:0.49, ease:"power2.inOut"}, 3.90);

    // ---- step 1 @0.24 : numeral 1, paper, rough yellow sketch ----
    ft("#p10-badge", {opacity:0, scale:0.6}, {opacity:1, scale:1, duration:0.2, ease:"power3.out", transformOrigin:"0% 0%"}, 0.24);

    ft("#p10-sksvg", {y:6}, {y:-6, duration:1.3, ease:"none"}, 0.24);

    tl.to("#p10-n1", {yPercent:-100, duration:0.18, ease:"power3.in"}, 1.52);
    tl.fromTo("#p10-n2", {yPercent:100}, {yPercent:0, duration:0.25, ease:"power3.out", immediateRender:false}, 1.62);

    draw("#p10-dm4", 0.3, 2.06);
    draw("#p10-dm5", 0.12, 2.06);
    draw("#p10-dm6", 0.12, 2.18);
    ft("#p10-dimtxt", {opacity:0, y:10}, {opacity:1, y:0, duration:0.25, ease:"power3.out"}, 2.2);

    // ---- step 3 @2.50 : numeral 3, drawing fills with the aluminium profile photo ----

    tl.fromTo("#p10-col", {filter:"blur(0px)"}, {filter:"blur(12px)", duration:0.29, ease:"power2.in", immediateRender:false}, 4.10);

    chunks.forEach(function(c){
      var ems = document.querySelectorAll(c.id + " em");
      for (var i = 0; i < ems.length; i++) {

      tl.to(c.id, {opacity:0, filter:"blur(6px)", duration:0.14, ease:"power3.in"}, c.out);
